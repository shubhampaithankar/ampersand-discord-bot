# Lavalink v4 — real working config (copied from the mini-pc, replaces the fresh-authored stub).
# Resolves ${LAVALINK_PASSWORD}/${SPOTIFY_CLIENT_ID}/${SPOTIFY_CLIENT_SECRET}/${DEEZER_ARL}/${DEEZER_MASTER_KEY} from the container env.
server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true

  lavasrc:
    providers:
      # YouTube returns SABR-only player responses that youtube-source 1.18.x cannot play,
      # so every yt* provider resolves a track that then fails at playback. Deezer first
      # (full tracks), SoundCloud as fallback for when Deezer is unavailable.
      - "dzisrc:%ISRC%"
      - "dzsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "IN"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
    deezer:
      arl: "${DEEZER_ARL}"
      masterDecryptionKey: "${DEEZER_MASTER_KEY}"
      # ponytail: MP3_128 is the free-account tier; FLAC/MP3_320 need Deezer Premium on the ARL account -- upgrade path is bumping formats once that's available.
      formats: ["MP3_128"]

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      repository: "https://maven.lavalink.dev/releases"

    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      timescale: true

    bufferDurationMs: 400
    frameBufferDurationMs: 3000
    opusEncodingQuality: 10
    resamplingQuality: HIGH

    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5
    useSeekGhosting: true

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO